:root{

}

  --ok:#5fcf94; --ok-soft:#133525; --warn:#f0b54d; --warn-soft:#382911; --bad:#f08a76; --bad-soft:#3f1f1a;
  --chart1:#6b93ff; --chart2:#34508f; --chart3:#e7b459; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{

  --brand:#6b93ff; --brand-deep:#2747b8; --brand-ink:#08102a; --brand-soft:#18264d; --accent:#e7b459; --accent-soft:#382a12;
  --ok:#5fcf94; --ok-soft:#133525; --warn:#f0b54d; --warn-soft:#382911; --bad:#f08a76; --bad-soft:#3f1f1a;
  --chart1:#6b93ff; --chart2:#34508f; --chart3:#e7b459; --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.55 var(--f-body);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;text-wrap:balance;line-height:1.25}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
a{color:var(--brand)}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:6px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.logo{display:flex;align-items:center;gap:10px;min-width:0}
.logo-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(145deg,#2c5ff0,#1638a8);display:grid;place-items:center;flex:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.logo-mark svg{width:23px;height:23px}
.logo b{display:block;font-family:var(--f-num);font-size:16px;font-weight:700;letter-spacing:-.01em}
.logo b span{color:var(--brand)}
.logo small{display:block;color:var(--muted);font-size:11.5px;line-height:1.2;font-family:var(--f-num)}
.top-tools{margin-left:auto;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--surface2);border:1px solid var(--line);border-radius:999px;padding:3px}
.seg button{border:0;background:none;padding:5px 12px;border-radius:999px;cursor:pointer;font-size:13px;color:var(--muted);font-weight:600}
.seg button[aria-pressed="true"]{background:var(--brand);color:var(--brand-ink)}
.ctx{display:flex;gap:8px;align-items:center;font-size:13px;flex-wrap:wrap}
.ctx select{padding:6px 10px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);max-width:220px;width:auto}
.demo-tag{font-size:11px;font-weight:700;letter-spacing:.08em;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:3px 9px;font-family:var(--f-num)}

.shell{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:calc(100% - 62px)}
.rail{border-right:1px solid var(--line);background:var(--surface);padding:14px 10px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto}
.rail h4{margin:14px 10px 6px;font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-family:var(--f-num)}
.rail a{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:10px;color:var(--ink);text-decoration:none;font-weight:500}
.rail a svg{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;opacity:.75}
.rail a:hover{background:var(--surface2)}
.rail a[aria-current="page"]{background:var(--brand-soft);color:var(--brand);font-weight:700}
.rail a .badge{margin-left:auto}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px;min-width:0}
.wrap{max-width:1180px;margin:0 auto;display:grid;gap:18px}
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;flex-wrap:wrap}
.head h1{font-weight:700;font-size:clamp(1.4rem,2.6vw,1.85rem);letter-spacing:-.01em}
.head p{margin:4px 0 0;color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}

.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:var(--shadow);min-width:0}
.card h2{font-size:1.05rem;font-weight:700;margin-bottom:12px;display:flex;align-items:center;gap:8px;justify-content:space-between;flex-wrap:wrap}
.grid{display:grid;gap:14px}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.kpi{padding:16px 18px}
.kpi small{color:var(--muted);font-size:13px;display:block}
.kpi strong{display:block;font-size:1.5rem;font-weight:700;margin-top:4px;font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.kpi span{font-size:12.5px;color:var(--muted)}
.kpi.accent{background:linear-gradient(150deg,#2457e6,#1638a8);color:#f3f6ff;border-color:transparent}
.kpi.accent small,.kpi.accent span{color:#c9d6fb}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:1px;background:var(--line);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.mini div{background:var(--surface);padding:12px 14px}
.mini small{display:block;color:var(--muted);font-size:12.5px}
.mini b{font-family:var(--f-num);font-size:1.15rem;font-variant-numeric:tabular-nums}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:10px;cursor:pointer;font-weight:600;font-size:14px;text-decoration:none;color:var(--ink);white-space:nowrap}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad-soft)}
.btn.sm{padding:5px 10px;font-size:13px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed}

.tablebox{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table{width:100%;border-collapse:collapse;font-size:14px;min-width:640px}
th{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);text-align:left;font-weight:600;background:var(--surface2);padding:10px 12px;font-family:var(--f-num)}
td{padding:10px 12px;border-top:1px solid var(--line);vertical-align:middle}
td.r,th.r{text-align:right}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.p-ok{color:var(--ok);background:var(--ok-soft)}.p-warn{color:var(--warn);background:var(--warn-soft)}.p-bad{color:var(--bad);background:var(--bad-soft)}.p-mute{color:var(--muted);background:var(--surface2)}.p-brand{color:var(--brand);background:var(--brand-soft)}
.badge{font-size:11px;font-weight:700;background:var(--bad);color:#fff;border-radius:999px;padding:1px 7px;font-family:var(--f-num)}
.muted{color:var(--muted)}.small{font-size:13px}
.banner{border-radius:12px;padding:12px 14px;display:flex;gap:10px;align-items:center;font-size:14px;flex-wrap:wrap}
.banner.warn{background:var(--warn-soft)}.banner.bad{background:var(--bad-soft)}.banner.info{background:var(--brand-soft)}
.empty{padding:28px;text-align:center;color:var(--muted)}
.pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:10px;font-size:13px;color:var(--muted)}
.tools{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.tools input,.tools select{width:auto;max-width:230px}

.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.form .full{grid-column:1/-1}
label.f{display:grid;gap:5px;font-size:13px;font-weight:600;color:var(--muted)}
label.chk{display:flex;gap:8px;align-items:center;font-size:14px;color:var(--ink);font-weight:500}
label.chk input{width:auto}
input,select,textarea{width:100%;padding:9px 11px;border-radius:10px;border:1px solid var(--line);background:var(--surface2);min-width:0;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand);outline-offset:0;border-color:transparent}
textarea{min-height:84px;resize:vertical}
td input,td select{padding:6px 8px;font-size:14px;width:110px}

.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font:12px var(--f-num)}
.legend{display:flex;gap:14px;font-size:13px;color:var(--muted);flex-wrap:wrap;font-weight:400}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.meter{height:8px;border-radius:99px;background:var(--surface2);overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--brand);border-radius:99px}
.flow{display:flex;gap:4px;flex-wrap:wrap;font-size:12px}
.flow span{padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.flow span.on{background:var(--brand);color:var(--brand-ink)}
.flow span.done{background:var(--brand-soft);color:var(--brand)}

.scrim{position:fixed;inset:0;background:rgba(6,12,28,.55);z-index:50;display:grid;place-items:center;padding:16px}
.modal{background:var(--surface);border-radius:18px;width:min(640px,100%);max-height:calc(100vh - 32px);overflow:auto;box-shadow:0 30px 80px rgba(0,0,0,.35);border:1px solid var(--line)}
.modal header{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.modal header h3{font-size:1.1rem}
.modal .body{padding:18px;display:grid;gap:14px}
.modal footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{border:0;background:var(--surface2);width:34px;height:34px;border-radius:10px;cursor:pointer;font-size:18px}

.receipt{background:#ffffff;color:#16213a;border-radius:12px;padding:20px;border:1px solid #d9e0ee;font-size:14px}
.receipt .rh{display:flex;justify-content:space-between;gap:10px;border-bottom:2px solid #1d4ed8;padding-bottom:10px;margin-bottom:10px}
.receipt .rh b{font-size:15px}
.receipt .brandline{font-family:var(--f-num);font-weight:700;color:#1d4ed8}
.receipt .rl{display:flex;justify-content:space-between;padding:4px 0;gap:10px}
.receipt .rt{display:flex;justify-content:space-between;font-weight:700;font-size:16px;border-top:1px solid #d9e0ee;margin-top:8px;padding-top:8px}
.receipt .stamp{display:inline-block;margin-top:10px;border:2px solid #157347;color:#157347;border-radius:8px;padding:2px 10px;font-weight:700;transform:rotate(-4deg);font-family:var(--f-num);letter-spacing:.1em}
.receipt .foot{margin-top:12px;font-size:11.5px;color:#5c6884}

.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-weight:600;z-index:60;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.plans{display:grid;gap:12px;grid-template-columns:repeat(5,minmax(0,1fr))}
.plan{display:grid;gap:8px;padding:18px;border-radius:16px;border:1px solid var(--line);background:var(--surface);align-content:start}
.plan.current{border:2px solid var(--brand)}
.plan .price{font-size:1.45rem;font-weight:700;font-family:var(--f-num)}
.plan ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px}
.matrix td,.matrix th{text-align:center}.matrix td:first-child,.matrix th:first-child{text-align:left}
.yes{color:var(--ok);font-weight:700}.no{color:var(--muted)}
.list-row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);align-items:center;flex-wrap:wrap}
.list-row:last-child{border-bottom:0}

@media (max-width:1100px){.plans{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media (max-width:980px){.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:1fr 1fr}.mini{grid-template-columns:repeat(2,minmax(0,1fr))}}

  .rail::-webkit-scrollbar{display:none}
  .rail h4{display:none}
  .rail a{white-space:nowrap;padding:7px 12px;font-size:14px}
  .rail a svg{display:none}
}
@media (max-width:620px){
  .g2,.g3{grid-template-columns:1fr}.form{grid-template-columns:1fr}.plans{grid-template-columns:1fr}
  .logo small{display:none}
  .ctx select{max-width:150px}
  .ctx>.muted{display:none}
  .kpi strong{font-size:1.28rem}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

const head=(title,sub,actions)=>'<div class="head"><div><h1>'+title+'</h1>'+(sub?'<p>'+sub+'</p>':'')+'</div>'+(actions?'<div class="tools">'+actions+'</div>':'')+'</div>';

const PAGE=12;
function table(cols,rows,empty,paged){
  if(!rows.length) return '<div class="empty">'+(empty||t("none"))+'</div>';
  let pr=rows,pager="";
  if(paged&&rows.length>PAGE){const pages=Math.ceil(rows.length/PAGE);UI.page=Math.min(UI.page,pages-1);pr=rows.slice(UI.page*PAGE,UI.page*PAGE+PAGE);
    pager='<div class="pager"><span>'+t("page")+' '+nf(UI.page+1)+' / '+nf(pages)+'</span><button class="btn sm" data-act="pg" data-id="-1"'+(UI.page===0?" disabled":"")+'>'+t("prev")+'</button><button class="btn sm" data-act="pg" data-id="1"'+(UI.page>=pages-1?" disabled":"")+'>'+t("nextPg")+'</button></div>';}
  return '<div class="tablebox"><table><thead><tr>'+cols.map(c=>'<th'+(c.r?' class="r"':'')+'>'+c.h+'</th>').join("")+'</tr></thead><tbody>'+pr.join("")+'</tbody></table></div>'+pager;
}

const waLink=(phone,text)=>"https://wa.me/"+waNum(phone)+"?text="+encodeURIComponent(text);

function statusBanner(){const o=O();if(!o||UI.role==="super"||UI.role==="tenant")return"";if(o.status==="expired"||o.status==="suspended")return'<div class="banner bad">'+t("expiredMsg")+'</div>';if(o.status==="grace")return'<div class="banner warn">'+t("graceMsg")+(UI.role==="landlord"?' <a class="btn sm" href="#sub" style="margin-left:auto">'+t("nSub")+'</a>':'')+'</div>';return"";}

const qmatch=(...s)=>{const q=UI.q.trim().toLowerCase();return !q||s.some(x=>String(x||"").toLowerCase().includes(q));};

function barChart(labels,series,colors){
  const W=640,H=240,L=58,R=12,Tp=14,B=30;const max=Math.max(1,...series.flat());
  const step=Math.pow(10,Math.floor(Math.log10(max)));const nice=[1,2,2.5,5,10].map(x=>x*step).find(x=>x*4>=max)||step*10;const top=nice*4;
  const ih=H-Tp-B,iw=W-L-R,gw=iw/labels.length,bw=Math.min(26,(gw-14)/series.length);let g="";
  for(let i=0;i<=4;i++){const v=nice*i,y=Tp+ih-ih*v/top;g+='<line x1="'+L+'" x2="'+(W-R)+'" y1="'+y+'" y2="'+y+'" stroke="var(--line)"/><text x="'+(L-8)+'" y="'+(y+4)+'" text-anchor="end">'+(v>=1000?(v/1000).toLocaleString(loc())+"k":v.toLocaleString(loc()))+'</text>';}
  labels.forEach((lb,i)=>{const x0=L+gw*i+(gw-bw*series.length-4*(series.length-1))/2;
    series.forEach((s,j)=>{const h=ih*s[i]/top;g+='<rect x="'+(x0+j*(bw+4))+'" y="'+(Tp+ih-h)+'" width="'+bw+'" height="'+Math.max(0,h)+'" rx="3" fill="'+colors[j]+'"><title>'+esc(lb)+': '+tk(s[i])+'</title></rect>';});
    g+='<text x="'+(L+gw*i+gw/2)+'" y="'+(H-10)+'" text-anchor="middle">'+esc(lb)+'</text>';});
  return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img">'+g+'</svg>';
}

/* ================================================================ metrics */
function metrics(m){
  const bills=mine("bills").filter(b=>b.month===m);
  const expected=bills.reduce((a,b)=>a+b.total,0), collected=bills.reduce((a,b)=>a+paidFor(b),0);
  const exp=mine("expenses").filter(e=>e.date.slice(0,7)===m).reduce((a,e)=>a+e.amount,0);
  const units=mine("units"),occ=units.filter(u=>activeTenantOf(u)).length;
  const outstanding=mine("bills").reduce((a,b)=>a+dueFor(b),0);
  return {bills,expected,collected,exp,net:collected-exp,units:units.length,occ,outstanding,props:allowedProps().length,tenants:mine("tenants").filter(x=>x.active).length};
}

/* ================================================================ actions */
function guard(p){if(locked()){toast(t("expiredMsg"));return false;}if(p&&!can(p)){toast(t("noPerm"));return false;}return true;}
function act(a,el){
  const id=el.dataset.id;
  switch(a){
   case"close":closeModal();break;
   case"pg":UI.page=Math.max(0,UI.page+Number(id));render();break;
   case"reset":S=seed();UI.readings={};UI.q="";UI.fil="";UI.page=0;persist();toast(t("resetDone"));render();break;
   case"bill":billModal(id);break;
   case"pay":if(guard("collect"))payModal(id);break;
   case"copyR":{const txt=window.__rcptText||"";try{navigator.clipboard.writeText(txt).then(()=>toast(t("copied")),selectR);}catch(e){selectR();}break;}
   case"savePay":{if(!guard("collect"))return;const b=S.bills.find(x=>x.id===id),d=dueFor(b),amt=Math.round(numv("pAmt")),meth=val("pMethod"),txn=val("pTxn").toUpperCase();
     if(!(amt>0))return showErr(t("payZero"));if(amt>d)return showErr(t("payTooMuch"));if(meth!=="cash"&&!txn)return showErr(t("txnNeeded"));if(txn&&S.payments.some(p=>p.txn===txn))return showErr(t("txnDup"));
     S.payments.push({id:nid("p"),orgId:b.orgId,billId:b.id,tenantId:b.tenantId,amount:amt,date:val("pDate")||TODAY,method:meth,txn,no:"R-"+(++S.seq.rcp),by:UI.role});
     audit((LANG==="bn"?"পেমেন্ট রেকর্ড · ":"Payment recorded · ")+unitName(unitById(b.unitId))+" · "+tk(amt));persist();render();billModal(b.id);toast(t("payDone"));break;}
   case"late":{if(!guard("bills"))return;const b=S.bills.find(x=>x.id===id);if(b.items.some(i=>i[0]==="late"))return;b.items.push(["late",LATE_FEE]);b.total+=LATE_FEE;audit((LANG==="bn"?"বিলম্ব ফি · ":"Late fee · ")+b.no);toast(t("lateApplied"));render();break;}
   case"gen":{if(!guard("bills"))return;const have=mine("bills").filter(b=>b.month===CUR),todo=mine("tenants").filter(x=>x.active&&!have.some(b=>b.tenantId===x.id));
     for(const x of todo){const u=unitById(x.unitId),r=UI.readings[u.id];if(r!=null&&r<u.lastRead){toast(t("badReading")+" · "+unitName(u));return;}}
     todo.forEach(x=>{const u=unitById(x.unitId),r=UI.readings[u.id],cur=r!=null?r:u.lastRead;mkBill(S,x,u,CUR,u.lastRead,cur,++S.seq.bill);u.lastRead=cur;});
     UI.readings={};if(todo.length){audit((LANG==="bn"?"ইনভয়েস তৈরি · ":"Invoices generated · ")+mName(CUR)+" · "+todo.length);toast(nf(todo.length)+" "+t("billsMade"));}else toast(t("alreadyBilled"));render();break;}
   case"nid":if(!can("nid"))return;UI.reveal[id]=!UI.reveal[id];if(UI.reveal[id])audit((LANG==="bn"?"NID দেখা হয়েছে · ":"National ID viewed · ")+tenById(id).name);render();break;
   case"newTenant":if(!guard("tenants"))return;if(overLimit("tenants")){toast(t("limitHit"));return;}tenantModal(null);break;
   case"editTenant":if(guard("tenants"))tenantModal(id);break;
   case"saveTenant":{if(!guard("tenants"))return;const name=val("tName"),phone=val("tPhone").replace(/[\s-]/g,""),unitId=val("tUnit"),x=id?tenById(id):null;
     if(!name||!phone)return showErr(t("needName"));if(!phoneOk(phone))return showErr(t("badPhone"));if(!unitId)return showErr(t("selectUnit"));if(val("tEnd")<=val("tStart"))return showErr(t("badDates"));
     if(S.tenants.find(z=>z.unitId===unitId&&z.active&&(!x||z.id!==x.id)))return showErr(t("unitTaken"));
     const rec={name,phone,email:val("tEmail"),emergency:val("tEmer"),unitId,members:numv("tMem")||1,start:val("tStart"),end:val("tEnd"),advance:numv("tAdv")};
     if(can("nid")||!x)rec.nid=val("tNid");
     if(x){Object.assign(x,rec);const lf=document.getElementById("tLeft");if(lf&&lf.checked)x.active=false;audit((LANG==="bn"?"ভাড়াটিয়ার তথ্য বদল · ":"Tenant updated · ")+name);}
